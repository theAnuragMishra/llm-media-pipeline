[project]
name = "media-pipeline"
version = "0.1.0"
description = "Async distributed media processing pipeline for automated course video generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sse-starlette>=2.0.0",
    "websockets>=12.0",
    "aio-pika>=9.4.0",
    "redis>=5.0.3",
    "edge-tts>=6.1.10",
    "pillow>=10.2.0",
    "openai>=1.14.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
